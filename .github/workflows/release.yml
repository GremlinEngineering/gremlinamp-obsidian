name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: python3 tools/build.py
      - name: Check plugin
        run: node --check dist/gremlinamp/main.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test "$GITHUB_REF" = "refs/tags/$version"
          gh release create "$version" --verify-tag --title "$version" --generate-notes \
            dist/gremlinamp/main.js dist/gremlinamp/manifest.json dist/gremlinamp/styles.css \
            "dist/gremlinamp-$version.zip"
